[project]
name = "pathfinder"
version = "0.1.0"
description = "A learning-first, deployable research-and-action agent backend."
requires-python = "==3.12.13"
dependencies = [
    "alembic>=1.18.5,<2",
    "fastapi>=0.141.1,<0.142",
    "httpx>=0.28.1,<0.29",
    "langchain>=1.3.15,<1.4",
    "langchain-core>=1.5.4,<1.6",
    "langchain-openai>=1.4.3,<1.5",
    "langfuse>=4.14.1,<4.15",
    "langgraph>=1.2.11,<1.3",
    "langgraph-checkpoint-postgres>=3.1.2,<3.2",
    "langsmith>=0.10.18,<0.11",
    "openai>=2.54.0,<2.55",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.3.4,<4",
    "PyJWT[crypto]>=2.13,<3",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "starlette>=1.3.1,<2",
    "structlog>=26.1.0,<27",
    "tavily-python>=0.7.27,<0.8",
    "uvicorn>=0.52.0,<0.53",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "mcp==2.1.1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.0,<0.17",
    "testcontainers[postgres]>=4.15.0,<5",
]

[tool.uv]
required-version = "==0.11.32"
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires an isolated PostgreSQL testcontainer",
]
testpaths = ["tests"]
xfail_strict = true
